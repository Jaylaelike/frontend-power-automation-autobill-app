version: '3.8'

services:
  # Production Dashboard
  dashboard:
    build:
      context: .
      target: standalone
    container_name: meter-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:../../data/production.db
    volumes:
      - ../../data:/app/data
      - ../../prisma:/app/prisma
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Development Dashboard
  dashboard-dev:
    build:
      context: .
      target: development
    container_name: meter-dashboard-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:../../data/dev.db
    volumes:
      - .:/app
      - /app/node_modules
      - ../../data:/app/data
      - ../../prisma:/app/prisma
    networks:
      - dashboard-network
    profiles:
      - dev

networks:
  dashboard-network:
    driver: bridge